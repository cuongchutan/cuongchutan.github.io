<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot Navigation Layers</title>
    <style>
      /* Same tokens as the thesis animation; the viewport stays a dark "screen" in both themes. */
      :root {
        --bg: transparent;
        --panel: #ffffff;
        --line: rgba(0, 0, 0, 0.12);
        --fg: #111111;
        --muted: #6b6b6b;
        --accent: #b509ac;
        --warn: #b8691a;
        --screen: #0b0d10;
        --font: "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --panel: #212529;
        --line: #424246;
        --fg: #e8e8e8;
        --muted: #9a9a9a;
        --accent: #2698ba;
        --warn: #f0a24a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden; /* the embedding page sizes the frame to fit, so no scroll bar */
        background: var(--bg);
      }
      body {
        color: var(--fg);
        font: 15px/1.55 var(--font);
      }
      [hidden] {
        display: none !important;
      }
      .wrap {
        display: grid;
        gap: 16px;
        padding: 4px 2px 8px;
      }
      .cases {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .case {
        all: unset;
        cursor: pointer;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        min-width: 0;
      }
      .case:focus-visible,
      .btn:focus-visible,
      .node:focus-visible,
      .chip:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .case[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .case b {
        display: block;
        font-weight: 600;
        font-size: 14px;
        line-height: 1.25;
      }
      .case span {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
      }
      .rail {
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding-top: 12px;
      }
      .rail::before {
        content: "";
        position: absolute;
        left: 12%;
        right: 12%;
        top: 19px;
        height: 2px;
        background: var(--line);
      }
      .node {
        all: unset;
        cursor: pointer;
        position: relative;
        display: grid;
        justify-items: center;
        gap: 5px;
        text-align: center;
        min-width: 0;
      }
      .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--line);
        z-index: 1;
      }
      .node.done .dot {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 35%, var(--panel));
      }
      .node.on .dot {
        border-color: var(--accent);
        background: var(--accent);
      }
      .node small {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .node.on small {
        color: var(--fg);
      }
      .bar {
        display: block;
        height: 3px;
        width: 70%;
        background: var(--line);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: var(--p, 0%);
        background: var(--accent);
      }
      .view {
        position: relative;
        aspect-ratio: 16 / 10;
        background: var(--screen);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .view canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: absolute;
        left: 10px;
        top: 9px;
        right: 10px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font: 500 11.5px/1.3 var(--mono);
        color: #d3d8de;
        pointer-events: none;
      }
      .hud span {
        background: rgba(10, 12, 15, 0.72);
        padding: 4px 8px;
        border-radius: 6px;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .btn {
        all: unset;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .chips {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px 8px;
        margin-top: 10px;
      }
      .chip {
        all: unset;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
      }
      .chip i {
        width: 14px;
        height: 4px;
        border-radius: 2px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      }
      .chip[aria-pressed="false"] {
        opacity: 0.45;
      }
      .chip.static {
        cursor: default;
      }
      .info {
        display: grid;
        gap: 12px;
        min-width: 0;
      }
      .info .num {
        font: 600 12px/1 var(--mono);
        color: var(--accent);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .info h3 {
        font-size: 22px;
        line-height: 1.2;
        font-weight: 500;
        margin: 0;
      }
      .info p {
        margin: 0;
        color: var(--muted);
        text-align: justify;
        hyphens: auto;
      }
      .tables {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 24px;
      }
      .tables h4 {
        margin: 0 0 4px;
        font: 600 11px/1.4 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        border-top: 1px solid var(--line);
      }
      dl div {
        display: contents;
      }
      dt,
      dd {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      dt {
        color: var(--muted);
        font-size: 13.5px;
        padding-right: 12px;
      }
      dd {
        margin: 0;
        font: 600 14px/1.4 var(--mono);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th,
      td {
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        text-align: right;
      }
      th {
        font-weight: 400;
        color: var(--muted);
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      td {
        font: 600 14px/1.4 var(--mono);
        font-variant-numeric: tabular-nums;
      }
      td:first-child {
        font: 400 13.5px/1.4 var(--font);
      }
      th + th,
      td + td {
        padding-left: 14px;
      }
      tr.me td {
        color: var(--accent);
      }
      thead tr {
        border-top: 1px solid var(--line);
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        border-left: 3px solid var(--warn);
        padding-left: 10px;
      }
      .tables.one {
        grid-template-columns: 1fr;
      }
      @media (max-width: 560px) {
        .view {
          aspect-ratio: 1 / 1;
        }
        #hudR {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .tables,
        .cases {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <nav class="rail" id="rail" aria-label="Steps"></nav>

      <div>
        <div class="view">
          <canvas id="cv" aria-label="Animation of the current step"></canvas>
          <div class="hud"><span id="hudL"></span><span id="hudR"></span></div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="controls">
          <button class="btn" id="play">Pause</button>
          <button class="btn" id="prev">Previous</button>
          <button class="btn" id="next">Next</button>
        </div>
      </div>

      <div class="info">
        <div class="num" id="snum"></div>
        <h3 id="stitle"></h3>
        <p id="stext"></p>
        <div class="tables">
          <div>
            <h4 id="h1"></h4>
            <dl id="f1"></dl>
          </div>
          <div>
            <h4 id="h2"></h4>
            <dl id="f2"></dl>
          </div>
        </div>
        <p class="note" id="snote"></p>
      </div>
    </div>

    <script src="data.js"></script>
    <script>
      const D = window.HUST_DATA;
      const FRAME = "hust";
      const RES = D.res; // m per map cell
      const COL = { lidar: "#ff5a5a", sonar: "#4ea1ff", ir: "#f0a24a", path: "#69c48a", goal: "#ffd166", infl: [64, 200, 230] };
      // Values below are read from the team's ROS1 configs (dashgo_nav, ir_sensor)
      const IR_ANG = [-45, -25, -10, 0, 10, 25, 45, 155, 180, 205]; // deg, CCW positive; first 7 face forward
      const R_ROBOT = 0.2,
        BUBBLE = 0.7,
        URGENT = 0.2,
        V_MAX = 0.2,
        SPEED = 2; // animation runs at 2× real speed
      const FLOW = [
        {
          d: 9000,
          node: "Robot",
          t: "Three sensor layers at three heights",
          hud: "SENSORS · side view and top view",
          text: "A 2D LiDAR only sees a thin slice of the world, 20–30 cm above the floor. Anything lower or higher is invisible to it, such as a low step or a box someone carries at waist height. The robot therefore stacks three layers: sonars below the LiDAR plane, the LiDAR itself, and a ring of ten infrared sensors at 0.8–1.2 m.",
        },
        {
          d: 15000,
          node: "Mapping",
          t: "Building the map while driving (SLAM)",
          hud: "GMAPPING · 0.05 m cells · LiDAR range 8 m",
          text: "The robot is driven through the room once. Each LiDAR scan marks the cells its beams cross as free and the cells they end on as walls, while a particle filter keeps track of where the robot is. The map shown is the real one the robot recorded in the AIR lab at HUST.",
        },
        {
          d: 16000,
          node: "Navigation",
          t: "Driving to a goal on the map",
          hud: "AMCL + MOVE_BASE · click the map to set a goal",
          text: "With the map saved, the robot localizes itself against it and plans a path to each goal. Walls are inflated by the robot's radius plus a safety margin (cyan), so the path keeps its distance. Click anywhere on the map to send the robot to a new goal.",
        },
        {
          d: 15000,
          node: "Safety layer",
          t: "When the LiDAR cannot see the obstacle",
          hud: "CMD_VEL_MUX · higher priority wins",
          text: "Someone steps in with a box at waist height. The LiDAR beams pass underneath it, so the navigation stack keeps driving. The infrared ring sees the box, and its safety controller, which has a higher priority in the velocity multiplexer, takes over and turns the robot away. Once the way is clear, navigation takes control again.",
        },
      ];
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // ---------- theme: follow the embedding page (al-folio sets data-theme on <html>), else the OS
      function applyTheme() {
        let t = null;
        try {
          t = parent !== window && parent.document.documentElement.getAttribute("data-theme");
        } catch (e) {}
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      }
      applyTheme();
      try {
        if (parent !== window)
          new MutationObserver(applyTheme).observe(parent.document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      } catch (e) {}
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

      function postHeight() {
        if (parent !== window)
          parent.postMessage({ thesisFrame: FRAME, h: Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height) + 4 }, "*");
      }
      new ResizeObserver(postHeight).observe(document.querySelector(".wrap"));

      // ---------- map: grid (0 unknown, 1 free, 2 wall) and distance to the nearest non-free cell
      const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const GW = D.w,
        GH = D.h,
        grid = unb64(D.grid),
        dist = unb64(D.dist);
      const at = (c, r) => (c < 0 || r < 0 || c >= GW || r >= GH ? 0 : grid[(r | 0) * GW + (c | 0)]);
      const PAL = { 0: [24, 28, 34], 1: [47, 55, 66], 2: [232, 237, 242] };
      function gridCanvas(src) {
        const c = document.createElement("canvas");
        c.width = GW;
        c.height = GH;
        const g = c.getContext("2d"),
          im = g.createImageData(GW, GH);
        for (let p = 0; p < GW * GH; p++) {
          const v = PAL[src[p]];
          im.data.set([v[0], v[1], v[2], 255], p * 4);
        }
        g.putImageData(im, 0, 0);
        return { c, g, im };
      }
      const full = gridCanvas(grid);
      // inflation layer: lethal within the robot radius, cost fading out to radius + 0.25 m
      const infl = document.createElement("canvas");
      infl.width = GW;
      infl.height = GH;
      {
        const g = infl.getContext("2d"),
          im = g.createImageData(GW, GH);
        const rr = R_ROBOT / RES,
          ri = (R_ROBOT + 0.25) / RES;
        for (let p = 0; p < GW * GH; p++) {
          const d = dist[p];
          if (grid[p] !== 1 || d > ri) continue;
          const a = d <= rr ? 200 : 150 * (1 - (d - rr) / (ri - rr)) + 30;
          im.data.set([...COL.infl, a], p * 4);
        }
        g.putImageData(im, 0, 0);
      }

      // ---------- ray casting on the grid (cells); returns distance in cells and the cell it stopped in
      function cast(c, r, ang, max, extra) {
        const dc = Math.cos(ang),
          dr = Math.sin(ang);
        for (let s = 0; s < max; s += 0.5) {
          const x = c + dc * s,
            y = r + dr * s,
            v = at(x, y);
          if (v === 2) return { d: s, x, y, hit: 2 };
          if (v === 0) return { d: s, x, y, hit: 0 };
          if (extra && extra(x, y)) return { d: s, x, y, hit: 3 };
        }
        return { d: max, x: c + dc * max, y: r + dr * max, hit: -1 };
      }

      // ---------- A* on the inflated grid (8-connected), used for the navigation goals
      function plan(s, g) {
        const N = GW * GH,
          gs = new Float32Array(N).fill(1e9),
          from = new Int32Array(N).fill(-1),
          closed = new Uint8Array(N),
          heap = [];
        const lethal = Math.round(R_ROBOT / RES); // dist is stored as whole cells
        const push = (f, i) => {
          heap.push([f, i]);
          let k = heap.length - 1;
          while (k > 0) {
            const p = (k - 1) >> 1;
            if (heap[p][0] <= heap[k][0]) break;
            [heap[p], heap[k]] = [heap[k], heap[p]];
            k = p;
          }
        };
        const pop = () => {
          const top = heap[0],
            last = heap.pop();
          if (heap.length) {
            heap[0] = last;
            let k = 0;
            for (;;) {
              const l = 2 * k + 1,
                r = l + 1;
              let m = k;
              if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
              if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
              if (m === k) break;
              [heap[m], heap[k]] = [heap[k], heap[m]];
              k = m;
            }
          }
          return top;
        };
        const si = s[1] * GW + s[0],
          gi = g[1] * GW + g[0];
        gs[si] = 0;
        push(0, si);
        while (heap.length) {
          const [, u] = pop();
          if (u === gi) break;
          if (closed[u]) continue;
          closed[u] = 1;
          const uc = u % GW,
            ur = (u / GW) | 0;
          for (let dr = -1; dr <= 1; dr++)
            for (let dc = -1; dc <= 1; dc++) {
              if (!dr && !dc) continue;
              const vc = uc + dc,
                vr = ur + dr;
              if (vc < 0 || vr < 0 || vc >= GW || vr >= GH) continue;
              const v = vr * GW + vc;
              if (dist[v] <= lethal && v !== gi) continue;
              const step = (dr && dc ? 1.4142 : 1) * (1 + (4 * Math.max(0, 12 - dist[v])) / 12),
                nd = gs[u] + step;
              if (nd < gs[v]) {
                gs[v] = nd;
                from[v] = u;
                push(nd + Math.hypot(vc - g[0], vr - g[1]), v);
              }
            }
        }
        if (from[gi] < 0) return null;
        const p = [];
        for (let k = gi; k >= 0; k = from[k]) p.push([k % GW, (k / GW) | 0]);
        p.reverse();
        // light smoothing so the robot does not zig-zag along grid diagonals
        const q = p.map((a) => a.slice());
        for (let it = 0; it < 8; it++)
          for (let k = 1; k < q.length - 1; k++)
            q[k] = [(q[k - 1][0] + 2 * q[k][0] + q[k + 1][0]) / 4, (q[k - 1][1] + 2 * q[k][1] + q[k + 1][1]) / 4];
        return q;
      }
      function nearestFree(c, r) {
        const lethal = R_ROBOT / RES + 2;
        let best = null;
        for (let rr = r - 15; rr <= r + 15; rr++)
          for (let cc = c - 15; cc <= c + 15; cc++) {
            if (cc < 0 || rr < 0 || cc >= GW || rr >= GH || dist[rr * GW + cc] <= lethal) continue;
            const d = (cc - c) ** 2 + (rr - r) ** 2;
            if (!best || d < best[0]) best = [d, [cc, rr]];
          }
        return best && best[1];
      }

      // ---------- state, rail and info panel
      let step = 0,
        t0 = performance.now(),
        playing = !reduce,
        pausedAt = 0;
      const rail = document.getElementById("rail");
      FLOW.forEach((f, i) => {
        const b = document.createElement("button");
        b.className = "node";
        b.innerHTML = `<span class="dot"></span><small>${f.node}</small><span class="bar"></span>`;
        b.addEventListener("click", () => go(i));
        rail.appendChild(b);
      });
      const nodes = [...rail.querySelectorAll(".node")];
      const row = (a, b) => `<div><dt>${a}</dt><dd>${b}</dd></div>`;
      const PANELS = [
        [
          "Robot",
          [
            ["Mobile base", "Dashgo D1"],
            ["Computers", "Raspberry Pi 4 + Arduino"],
            ["Robot radius", "0.20 m"],
            ["Software", "ROS1"],
          ],
          "Sensor layers",
          [
            ["Sonar · 4×", "0.11–0.20 m"],
            ["LiDAR · YDLidar G2", "0.20–0.30 m"],
            ["Infrared · 10× Sharp", "0.8–1.2 m"],
            ["Infrared range", "0.1–0.8 m"],
          ],
          "The heights are the obstacle bands each sensor marks in the navigation costmap, taken from the team's configuration files.",
        ],
        [
          "SLAM",
          [
            ["Method", "GMapping"],
            ["Particles", "8"],
            ["Cell size", "0.05 m"],
            ["LiDAR range used", "8 m"],
          ],
          "This map",
          [
            ["Room", "AIR lab, HUST"],
            ["Size", `${(GW * RES).toFixed(1)} × ${(GH * RES).toFixed(1)} m`],
            ["Cells", `${GW} × ${GH}`],
            ["Drive", `${(D.tour.length * 1.5 * RES).toFixed(0)} m loop`],
          ],
          "The map is the one the robot recorded. The drive and the scans are re-simulated on top of it, so the build-up only approximates the real run.",
        ],
        [
          "Localization & planning",
          [
            ["Localization", "AMCL"],
            ["Planner", "move_base"],
            ["Local planner", "TEB"],
            ["Wall inflation", "0.25 m"],
          ],
          "Limits",
          [
            ["Max speed", "0.2 m/s"],
            ["Max turn rate", "0.4 rad/s"],
            ["Min distance to obstacles", "0.3 m"],
            ["Shown at", `${SPEED}× speed`],
          ],
          "The paths here are planned in your browser on the recorded map with the same robot radius and inflation; the real robot ran the ROS planners.",
        ],
        [
          "Velocity multiplexer",
          [
            ["Safety controller", "priority 10"],
            ["Infrared safety", "priority 9"],
            ["Teleoperation", "priority 7"],
            ["Navigation", "priority 5"],
          ],
          "Infrared safety rules",
          [
            ["Turn away below", `${BUBBLE.toFixed(2)} m`],
            ["Stop below", `${URGENT.toFixed(2)} m`],
            ["Turn rate", "2.0 rad/s"],
            ["Sensors facing forward", "7 of 10"],
          ],
          "Re-simulated from the controller's rules. The real robot doing this is in the first video below.",
        ],
      ];
      function renderPanel() {
        const f = FLOW[step],
          p = PANELS[step];
        document.getElementById("snum").textContent = `Step ${step + 1} / ${FLOW.length} · ${f.node}`;
        document.getElementById("stitle").textContent = f.t;
        document.getElementById("stext").textContent = f.text;
        document.getElementById("hudL").textContent = f.hud;
        document.getElementById("hudR").textContent =
          step === 0 ? "AIR lab robot · HUST 2020" : step === 3 ? `${SPEED}× speed` : "AIR lab, HUST · recorded map";
        document.getElementById("h1").textContent = p[0];
        document.getElementById("f1").innerHTML = p[1].map((r) => row(...r)).join("");
        document.getElementById("h2").textContent = p[2];
        document.getElementById("f2").innerHTML = p[3].map((r) => row(...r)).join("");
        document.getElementById("snote").textContent = p[4];
        let h = "";
        if (step === 0)
          h = [
            ["Sonar", COL.sonar],
            ["LiDAR", COL.lidar],
            ["Infrared", COL.ir],
          ]
            .map(([n, c]) => `<span class="chip static"><i style="background:${c}"></i>${n}</span>`)
            .join("");
        if (step === 1)

      const playBtn = document.getElementById("play");

      playBtn.textContent = playing ? "Pause" : "Play";

      // ---------- drawing helpers
      const cv = document.getElementById("cv"),

      function fit() {

      const MONO = "ui-monospace, Menlo, Consolas, monospace";
      function label(txt, x, y, col = "#d3d8de", align = "left", font = `500 11.5px ${MONO}`) {

      // camera: map cells -> screen; fits the map (or a window of it) below the HUD

      }
      const S = (c, r) => [CAM.ox + CAM.s * c, CAM.oy + CAM.s * r];
      function drawMap(img, alpha = 1) {
        ctx.save();

        ctx.restore();
      }
      function robot(c, r, th, col = "#ffffff") {
        const [x, y] = S(c, r),
          rad = (R_ROBOT / RES) * CAM.s;
        ctx.fillStyle = "rgba(255,255,255,.12)";

        ctx.lineWidth = 2;

        ctx.stroke();

      function polyline(pts, col, w, dash) {

        ctx.setLineDash(dash || []);
        ctx.beginPath();
        pts.forEach((p, k) => {
          const q = S(p[0], p[1]);

        ctx.setLineDash([]);
      }
      function goalMark(c, r, a = 1) {
        const [x, y] = S(c, r);
        ctx.globalAlpha = a;

      // ---------- step 1: side view of the robot and its sensor layers, plus a top view
      function drawRobotStep(W, H, u) {
        const wide = W >= 560;
        const A = wide ? { x: 70, y: 56, w: W * 0.58 - 90, h: H - 96 } : { x: 46, y: 50, w: W - 66, h: (H - 80) * 0.58 };

        ctx.lineWidth = 1;

        ctx.moveTo(A.x - 10, Z(0));

        ctx.stroke();

        });

        ctx.strokeStyle = "#cfd5dc";
        ctx.lineWidth = 1.5;
        ctx.beginPath();

        ctx.fill();
        ctx.stroke();
        for (const m of [-0.15, 0.15]) {
          ctx.beginPath();

        ctx.beginPath();
        ctx.roundRect(X(-0.17), Z(1.04), X(0.17) - X(-0.17), Z(1.0) - Z(1.04), 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#4b5563";
        ctx.beginPath();
        ctx.moveTo(X(-0.1), Z(1.05));
        ctx.lineTo(X(0.12), Z(1.22));
        ctx.lineTo(X(0.15), Z(1.19));
        ctx.lineTo(X(-0.06), Z(1.04));
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#11151a";
        for (const m of [-0.12, 0.12]) {
          ctx.beginPath();
          ctx.arc(X(m), Z(0.03), Z(0) - Z(0.03), 0, 7);
          ctx.fill();
        }
        ctx.fillStyle = COL.lidar;
        ctx.fillRect(X(-0.05), Z(0.27), X(0.05) - X(-0.05), Z(0.2) - Z(0.27));
        ctx.fillStyle = COL.sonar;
        ctx.fillRect(X(0.17), Z(0.17), 4, Z(0.13) - Z(0.17));

      // ---------- step 2: GMapping re-simulated on the recorded map

      // ---------- step 3: navigation to a queue of goals; a click sets a new goal
      let nav = null;
      function resetNav() {

      // ---------- step 4: infrared safety controller vs. navigation, simulated from t = 0 each frame
      const SAFE = { c0: 62, r0: 125, gc: 140, box: { c: 98, r: 125, w: 7, h: 9 }, t1: 0.6, t2: 6.5 };
      function boxAt(t) {

        const B = SAFE.box,
          k = t < SAFE.t1 ? 0 : t < SAFE.t1 + 1 ? ease(t - SAFE.t1) : t < SAFE.t2 ? 1 : 1 - ease(t - SAFE.t2);

      }
      // the scene keeps walls out of infrared range, so only the box can return a reading
      function irCast(x, y, a, hit) {

      const inBox = (b) => (x, y) => b && Math.abs(x - b.c) < b.w / 2 && Math.abs(y - b.r) < b.h / 2;
      function simSafety(T) {
        // the infrared controller decides at 2 Hz and its command holds until the next decision (mux timeout 0.5 s)
        let c = SAFE.c0,
          r = SAFE.r0,
          th = 0,
          mode = "nav",
          ir = [],
          irW = 0,
          irUntil = -1,
          nextDecision = 0;
        const dt = 1 / 50,
          rc = R_ROBOT / RES,
          period = 0.5 / SPEED;
        for (let t = 0; t <= T; t += dt) {
          const b = boxAt(t),
            hit = inBox(b);
          ir = IR_ANG.slice(0, 7).map((deg) => {
            const a = th - (deg * Math.PI) / 180,
              sx = c + Math.cos(a) * rc,
              sy = r + Math.sin(a) * rc,
              h = irCast(sx, sy, a, hit);
            return { a, sx, sy, d: h * RES, hit: h < 0.8 / RES ? 3 : -1 };
          });
          if (t >= nextDecision) {
            nextDecision += period;
            const close = ir.map((s) => (s.d < BUBBLE ? 1 : 0));
            if (ir.some((s) => s.d < URGENT)) {
              irW = 0;
              irUntil = t + period;
            } else if (close.includes(1)) {
              // same rule as the controller: more hits on the left -> turn right, else turn left
              const right = close.slice(0, 4).reduce((a, b) => a + b),
                left = close.slice(4).reduce((a, b) => a + b);
              irW = left > right ? 2.0 : -2.0; // screen y points down, so a left (CCW) turn is negative
              irUntil = t + period;
            }
          }
          const dg = Math.atan2(SAFE.r0 - r, SAFE.gc - c);
          let v = 0,
            w = 0;
          if (t < irUntil) {
            mode = irW ? "ir" : "stop";
            w = irW;
            v = Math.max(0, V_MAX - 0.2);
          } else if (Math.abs(SAFE.gc - c) < 2) mode = "done";
          else {
            mode = "nav";
            const e = Math.atan2(Math.sin(dg - th), Math.cos(dg - th));
            w = Math.max(-0.4, Math.min(0.4, 1.5 * e));
            v = Math.abs(e) > 0.6 ? 0 : V_MAX;
          }
          th += w * dt * SPEED;
          c += (Math.cos(th) * v * dt * SPEED) / RES;
          r += (Math.sin(th) * v * dt * SPEED) / RES;
        }
        return { c, r, th, mode, ir };
      }
      function drawSafety(W, H, T) {
        const wide = W >= 560;
        camera(W, H, wide ? 38 : 55, 92, wide ? 162 : 150, 158);
        drawMap(full.c, 0.9);
        const st = simSafety(T),
          b = boxAt(T);
        // LiDAR scan from the robot: it ignores the box, which is above its plane
        const pts = [];
        for (let k = 0; k < 360; k += 2) {
          const h = cast(st.c, st.r, (k * Math.PI) / 180, 8 / RES);
          if (h.hit === 2) pts.push([h.x, h.y]);
        }
        ctx.fillStyle = COL.lidar;
        for (const p of pts) {
          const q = S(p[0], p[1]);
          ctx.fillRect(q[0] - 1.5, q[1] - 1.5, 3, 3);
        }
        polyline(
          [
            [st.c, st.r],
            [SAFE.gc, SAFE.r0],
          ],
          "rgba(105,196,138,.55)",
          2,
          [6, 5]
        );
        goalMark(SAFE.gc, SAFE.r0);
        if (b) {
          const [x, y] = S(b.c - b.w / 2, b.r - b.h / 2);
          ctx.globalAlpha = b.a;
          ctx.fillStyle = "rgba(160,170,182,.25)";
          ctx.strokeStyle = "#c3cad3";
          ctx.setLineDash([4, 3]);
          ctx.lineWidth = 1.5;
          ctx.fillRect(x, y, b.w * CAM.s, b.h * CAM.s);
          ctx.strokeRect(x, y, b.w * CAM.s, b.h * CAM.s);
          ctx.setLineDash([]);
          label("box at ~1 m height", x + (b.w * CAM.s) / 2, y - 8, "#c3cad3", "center", `500 11px ${MONO}`);
          label("(above the LiDAR plane)", x + (b.w * CAM.s) / 2, y + b.h * CAM.s + 15, "#98a0ab", "center", `500 10px ${MONO}`);
          ctx.globalAlpha = 1;
        }
        // infrared beams: bright where they see something inside the 0.7 m bubble
        for (const s of st.ir) {
          const [x0, y0] = S(s.sx, s.sy),
            e = s.d / RES,
            [x1, y1] = S(s.sx + Math.cos(s.a) * e, s.sy + Math.sin(s.a) * e),
            on = s.d < BUBBLE;
          ctx.strokeStyle = on ? COL.ir : "rgba(240,162,74,.35)";
          ctx.lineWidth = on ? 2.4 : 1.2;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
          if (s.hit === 3) {
            ctx.fillStyle = COL.ir;
            ctx.beginPath();
            ctx.arc(x1, y1, 3, 0, 7);
            ctx.fill();
          }
        }
        robot(st.c, st.r, st.th, st.mode === "ir" || st.mode === "stop" ? COL.ir : "#ffffff");
        // the multiplexer: highest-priority active input drives the wheels
        const rows = [
          ["10", "Safety controller", false],
          ["9", "Infrared safety", st.mode === "ir" || st.mode === "stop"],
          ["7", "Teleoperation", false],
          ["5", "Navigation", st.mode === "nav"],
        ];
        const bx = wide ? W - 206 : 12,
          by = wide ? 46 : H - 26 - 4 * 19 - 22,
          bw = 192;
        ctx.fillStyle = "rgba(10,12,15,.82)";
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, 22 + rows.length * 19, 8);
        ctx.fill();
        label("cmd_vel_mux", bx + 10, by + 15, "#98a0ab", "left", `600 10.5px ${MONO}`);
        rows.forEach(([p, n, on], k) => {
          const y = by + 34 + k * 19;
          label(p.padStart(2), bx + 10, y, on ? (k === 1 ? COL.ir : COL.path) : "#59616c", "left", `${on ? 700 : 500} 11px ${MONO}`);
          label(n, bx + 34, y, on ? (k === 1 ? COL.ir : COL.path) : "#7d8692", "left", `${on ? 700 : 500} 11px ${MONO}`);
          if (on && wide) label("◀ driving", bx + bw - 10, y, k === 1 ? COL.ir : COL.path, "right", `700 10.5px ${MONO}`);
        });
        ctx.fillStyle = "rgba(11,13,16,.85)";
        ctx.fillRect(0, H - 26, W, 26);
        const msg = {
          nav: "navigation drives towards the goal",
          ir: "infrared sees the box inside 0.7 m: turning away",
          stop: "closer than 0.2 m: stop",
          done: "goal reached",
        }[st.mode];
        const minIr = Math.min(...st.ir.map((s) => s.d));
        label(msg, 16, H - 10, st.mode === "ir" || st.mode === "stop" ? COL.ir : "#d3d8de");
        if (wide) label(`nearest infrared reading ${minIr >= 0.8 ? "> 0.80" : minIr.toFixed(2)} m`, W - 16, H - 10, "#98a0ab", "right");
      }

      let lastNow = performance.now();
      function tick(now) {
        const [W, H] = fit(),
          f = FLOW[step],
          dt = Math.min(0.05, (now - lastNow) / 1000);
        lastNow = now;
        let el = playing ? now - t0 : pausedAt;
        if (playing && el > f.d) {
          go(step + 1);
          el = 0;
        }
        const u = reduce ? 1 : Math.min(el / f.d, 1);
        nodes.forEach((nd, i) => nd.querySelector(".bar").style.setProperty("--p", i < step ? "100%" : i === step ? `${u * 100}%` : "0%"));
        ctx.fillStyle = "#0b0d10";
        ctx.fillRect(0, 0, W, H);
        if (step === 0) drawRobotStep(W, H, u);
        else if (step === 1) drawMapping(W, H, u);
        else if (step === 2) drawNav(W, H, playing ? dt : 0);
        else drawSafety(W, H, reduce ? 4 : el / 1000);
        requestAnimationFrame(tick);
      }
      renderPanel();
      resetNav();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
